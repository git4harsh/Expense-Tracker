server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/expense_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: expense-notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.harsh.expense.events
        spring.json.value.default.type: com.harsh.expense.events.ExpenseCreatedEvent

app:
  jwt:
    # Set JWT_SECRET to a private random value of at least 32 bytes before starting.
    secret: ${JWT_SECRET}
    # Short-lived access token (minutes). JWT_EXPIRATION_MINUTES is accepted for backward compatibility.
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:${JWT_EXPIRATION_MINUTES:15}}
    # Long-lived refresh token (days) used for rotation.
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  cors:
    # Comma-separated allowed origins. Empty = permissive local-dev defaults in CORS config.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  auth-rate-limit:
    # Simple in-memory brute-force protection for auth endpoints (per IP).
    max-requests: ${APP_AUTH_RATE_LIMIT_MAX_REQUESTS:20}
    window-seconds: ${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}


springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: expense-tracker-api

info:
  app:
    name: Expense Tracker API
    description: Personal expense management backend
    version: 1.0.0
